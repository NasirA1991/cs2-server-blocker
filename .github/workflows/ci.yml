name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: |
          # The unit suite mocks the firewall. Keep this step non-blocking so a
          # transient runner mirror/DNS outage cannot fail the code tests.
          sudo timeout 60 apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update || true
          sudo timeout 120 apt-get install -y nftables ipset iptables || true
      - name: Compile
        run: python3 -m compileall -q cs2blocker tests
      - name: Unit and integration tests
        run: python3 -m unittest discover -s tests -v

  gui-smoke:
    name: GUI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construct the window in an Arch container
        run: |
          # Use the same distro as the Arch package job. The Ubuntu runner's
          # azure archive mirror is periodically unreachable, which made the
          # apt-based install flaky.
          docker run --rm -v "$PWD":/src -w /src archlinux:latest bash -lc '
            pacman -Syu --noconfirm --needed python python-gobject python-cairo gtk4 libadwaita xorg-server-xvfb
            GSK_RENDERER=cairo GTK_A11Y=none xvfb-run -a ./cs2blocker-gui --smoke-test
          '

  netns:
    name: nftables netns integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure nftables is present
        run: |
          command -v nft
          command -v ip
      - name: Apply and clear inside a network namespace
        run: sudo bash ./scripts/netns-integration.sh

  packages:
    name: Debian, RPM and tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nfpm
        run: |
          curl -sSL -o /tmp/nfpm.tar.gz \
            https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz
          sudo tar -xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm
          nfpm --version
      - name: Resolve and verify version
        run: |
          VERSION=$(python3 -c 'import cs2blocker; print(cs2blocker.__version__)')
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            test "$TAG_VERSION" = "$VERSION" || {
              echo "tag $TAG_VERSION does not match __version__ $VERSION" >&2
              exit 1
            }
          fi
          grep -qx "pkgver=$VERSION" packaging/PKGBUILD
          grep -qx "pkgver=$VERSION" packaging/aur/PKGBUILD
          grep -qx "version: $VERSION" packaging/nfpm.yaml
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Verify installer ownership
        run: |
          sudo ./packaging/install.sh --root /tmp/cs2blocker-stage --no-daemon-reload
          if find /tmp/cs2blocker-stage/usr/lib/cs2blocker -not -user root -print -quit | grep -q .; then
            echo "install.sh left non-root-owned helper code" >&2
            exit 1
          fi
          if find /tmp/cs2blocker-stage/usr/lib/cs2blocker -perm /022 -print -quit | grep -q .; then
            echo "install.sh left group/world-writable helper code" >&2
            exit 1
          fi
      - name: Stage files
        run: ./packaging/install.sh --root packaging/staging --no-daemon-reload
      - name: Build packages
        run: |
          mkdir -p packaging/dist
          nfpm package --config packaging/nfpm.yaml --packager deb \
            --target "packaging/dist/cs2blocker_${VERSION}-1_amd64.deb"
          nfpm package --config packaging/nfpm.yaml --packager rpm \
            --target "packaging/dist/cs2blocker-${VERSION}-1.x86_64.rpm"
          git archive --format=tar.gz --prefix="cs2blocker-${VERSION}/" \
            -o "packaging/dist/cs2blocker-${VERSION}.tar.gz" HEAD
          (cd packaging/dist && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: packaging/dist/*

  arch:
    name: Arch package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build in Arch Linux
        run: |
          docker run --rm -v "$PWD":/src -w /src archlinux:latest bash -lc '
            pacman -Syu --noconfirm --needed base-devel git python nftables polkit python-gobject python-cairo gtk4 libadwaita
            useradd -m builder
            chown -R builder:builder /src
            su builder -c "cd /src/packaging && makepkg -f --nodeps"
          '
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: packaging/cs2blocker-*.pkg.tar.zst
