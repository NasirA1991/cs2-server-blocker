name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: |
          # The unit suite mocks the firewall. Keep this step non-blocking so a
          # transient runner mirror/DNS outage cannot fail the code tests.
          sudo timeout 60 apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update || true
          sudo timeout 120 apt-get install -y nftables ipset iptables || true
      - name: Compile
        run: python3 -m compileall -q cs2blocker tests
      - name: Unit and integration tests
        run: python3 -m unittest discover -s tests -v

  shellcheck:
    name: shellcheck installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Check shell scripts
        run: shellcheck install.sh uninstall.sh packaging/install.sh packaging/uninstall.sh

  installer:
    name: Source installer round trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install firewall tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iptables ipset
      - name: Ensure system parent directories are safe
        # GitHub's Ubuntu image has some world-writable /usr/share directories.
        # The installer must refuse those, so normalize the test runner first.
        run: |
          for directory in /usr /usr/lib /usr/lib/systemd/system /usr/share \
            /usr/share/applications /usr/share/icons /usr/share/icons/hicolor \
            /usr/share/icons/hicolor/scalable \
            /usr/share/icons/hicolor/scalable/apps /usr/share/polkit-1 \
            /usr/share/polkit-1/actions /usr/share/metainfo \
            /usr/share/bash-completion /usr/share/bash-completion/completions \
            /usr/share/zsh /usr/share/zsh/site-functions /usr/share/fish \
            /usr/share/fish/vendor_completions.d /usr/share/man /usr/share/man/man1 \
            /usr/share/licenses; do
            if [[ -d "$directory" ]]; then
              sudo chmod go-w "$directory"
            fi
          done
          # The runner image occasionally has other world-writable /usr/share
          # directories (for example /usr/share/licenses). Normalize them all
          # so the test exercises the installer, not image drift.
          sudo find /usr/share -xdev -type d -perm -0002 -exec chmod go-w {} +
      - name: Record system directory attributes
        run: |
          stat -c '%a %U %n' /usr /usr/lib /usr/share /usr/share/icons/hicolor /usr/share/icons/hicolor/scalable /usr/share/polkit-1/actions \
            | tee /tmp/cs2blocker-dir-attrs.before
      - name: Install under restrictive umask
        run: |
          set -euo pipefail
          sudo bash -c 'umask 077; ./packaging/install.sh --skip-deps'
          test -f /usr/lib/cs2blocker/install-manifest.txt
          test "$(stat -c '%a %U' /usr/share/licenses)" = "755 root"
          stat -c '%a %U %n' /usr /usr/lib /usr/share /usr/share/icons/hicolor /usr/share/icons/hicolor/scalable /usr/share/polkit-1/actions \
            | tee /tmp/cs2blocker-dir-attrs.after
          diff -u /tmp/cs2blocker-dir-attrs.before /tmp/cs2blocker-dir-attrs.after
      - name: Upgrade removes stale manifest files
        run: |
          set -euo pipefail
          manifest=/usr/lib/cs2blocker/install-manifest.txt
          sudo install -d -m 0755 /usr/lib/cs2blocker/old_module
          printf 'print("old module")\n' | sudo tee /usr/lib/cs2blocker/old_module/x.py >/dev/null
          printf '%s\n' /usr/lib/cs2blocker/old_module/x.py | sudo tee -a "$manifest" >/dev/null
          sudo bash -c 'umask 077; ./packaging/install.sh --skip-deps'
          test ! -e /usr/lib/cs2blocker/old_module/x.py
          test ! -d /usr/lib/cs2blocker/old_module
          test "$(stat -c '%a %U' /usr/share/licenses)" = "755 root"
          stat -c '%a %U %n' /usr /usr/lib /usr/share /usr/share/icons/hicolor /usr/share/icons/hicolor/scalable /usr/share/polkit-1/actions \
            | tee /tmp/cs2blocker-dir-attrs.upgrade
          diff -u /tmp/cs2blocker-dir-attrs.before /tmp/cs2blocker-dir-attrs.upgrade
      - name: Uninstall and verify cleanup
        run: |
          set -euo pipefail
          manifest=/usr/lib/cs2blocker/install-manifest.txt
          sudo cp "$manifest" /tmp/cs2blocker-manifest.txt
          mapfile -t units < <(grep -l '^\[Install\]' packaging/systemd/* | xargs -n1 basename)
          sudo systemctl enable "${units[@]}"
          sudo find /etc/systemd/system -type l -lname '*cs2blocker*' > /tmp/cs2blocker-enable-links
          if ! grep -q . /tmp/cs2blocker-enable-links; then
            echo "enable did not create symlinks; test is invalid" >&2
            exit 1
          fi
          sudo ./packaging/uninstall.sh --yes
          test ! -e "$manifest"
          while IFS= read -r path; do
            test -z "$path" && continue
            test ! -e "$path" || {
              echo "installer left behind: $path" >&2
              exit 1
            }
          done < /tmp/cs2blocker-manifest.txt
          if sudo nft list table inet cs2blocker >/dev/null 2>&1; then
            echo "nftables table inet cs2blocker still exists" >&2
            exit 1
          fi
          if command -v iptables >/dev/null && sudo iptables -w 5 -S CS2BLOCKER >/dev/null 2>&1; then
            echo "iptables chain CS2BLOCKER still exists" >&2
            exit 1
          fi
          sudo systemctl list-unit-files 'cs2blocker*' --no-legend > /tmp/cs2blocker-leftover-units 2>/dev/null || true
          if grep -q . /tmp/cs2blocker-leftover-units; then
            echo "systemd still lists cs2blocker units" >&2
            cat /tmp/cs2blocker-leftover-units >&2
            exit 1
          fi
          sudo find /etc/systemd/system -maxdepth 2 -type l -lname '*cs2blocker*' > /tmp/cs2blocker-leftover-links
          if grep -q . /tmp/cs2blocker-leftover-links; then
            echo "systemd enablement symlink still exists" >&2
            exit 1
          fi

  gui-smoke:
    name: GUI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construct the window in an Arch container
        run: |
          # Use the same distro as the Arch package job. The Ubuntu runner's
          # azure archive mirror is periodically unreachable, which made the
          # apt-based install flaky.
          docker run --rm -v "$PWD":/src -w /src archlinux:latest bash -lc '
            pacman -Syu --noconfirm --needed appstream python python-gobject python-cairo gtk4 libadwaita xorg-server-xvfb
            appstreamcli validate --no-net packaging/org.cs2blocker.Gui.metainfo.xml
            GSK_RENDERER=cairo GTK_A11Y=none xvfb-run -a ./cs2blocker-gui --smoke-test
          '

  netns:
    name: nftables and iptables netns integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run firewall integration in an Arch container
        # The Ubuntu runner's azure.archive.ubuntu.com mirror intermittently
        # stalls, and `ipset` is not preinstalled. Use a privileged Arch
        # container so both backends and their tools are available reliably.
        run: |
          docker run --rm --privileged -v "$PWD":/src -w /src archlinux:latest bash -lc '
            pacman -Syu --noconfirm --needed nftables iptables ipset iproute2 python
            bash ./scripts/netns-integration.sh
          '

  packages:
    name: Debian, RPM and tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nfpm
        run: |
          curl -sSL -o /tmp/nfpm.tar.gz \
            https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz
          sudo tar -xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm
          nfpm --version
      - name: Resolve and verify version
        run: |
          VERSION=$(python3 -c 'import cs2blocker; print(cs2blocker.__version__)')
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            test "$TAG_VERSION" = "$VERSION" || {
              echo "tag $TAG_VERSION does not match __version__ $VERSION" >&2
              exit 1
            }
          fi
          grep -qx "pkgver=$VERSION" packaging/PKGBUILD
          grep -qx "pkgver=$VERSION" packaging/aur/PKGBUILD
          grep -qx "version: $VERSION" packaging/nfpm.yaml
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Verify installer ownership
        run: |
          sudo ./packaging/install.sh --root /tmp/cs2blocker-stage --no-daemon-reload
          if find /tmp/cs2blocker-stage/usr/lib/cs2blocker -not -user root -print -quit | grep -q .; then
            echo "install.sh left non-root-owned helper code" >&2
            exit 1
          fi
          if find /tmp/cs2blocker-stage/usr/lib/cs2blocker -perm /022 -print -quit | grep -q .; then
            echo "install.sh left group/world-writable helper code" >&2
            exit 1
          fi
      - name: Stage files
        run: ./packaging/install.sh --root packaging/staging --no-daemon-reload
      - name: Build packages
        run: |
          mkdir -p packaging/dist
          nfpm package --config packaging/nfpm.yaml --packager deb \
            --target "packaging/dist/cs2blocker_${VERSION}-1_amd64.deb"
          nfpm package --config packaging/nfpm.yaml --packager rpm \
            --target "packaging/dist/cs2blocker-${VERSION}-1.x86_64.rpm"
          git archive --format=tar.gz --prefix="cs2blocker-${VERSION}/" \
            -o "packaging/dist/cs2blocker-${VERSION}.tar.gz" HEAD
          (cd packaging/dist && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: packaging/dist/*

  arch:
    name: Arch package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build in Arch Linux
        run: |
          docker run --rm -v "$PWD":/src -w /src archlinux:latest bash -lc '
            pacman -Syu --noconfirm --needed base-devel git python nftables polkit python-gobject python-cairo gtk4 libadwaita
            useradd -m builder
            chown -R builder:builder /src
            su builder -c "cd /src/packaging && makepkg -f --nodeps"
          '
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: packaging/cs2blocker-*.pkg.tar.zst

  get-sh-shellcheck:
    name: get.sh shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: >-
          docker run --rm -v "$PWD":/mnt -w /mnt
          koalaman/shellcheck:stable get.sh

  get-sh-dry-run:
    name: get.sh dry-run (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu
            image: ubuntu:24.04
            expected: "Method: .deb package"
          - distro: fedora
            image: fedora:41
            expected: "Method: .rpm package"
          - distro: arch
            image: archlinux:latest
            expected: "Method: AUR"
    steps:
      - uses: actions/checkout@v4
      - name: Detect the expected method in ${{ matrix.distro }}
        run: |
          set -euo pipefail
          docker run --rm --user 1000:1000 -v "$PWD":/src -w /src "${{ matrix.image }}" \
            bash -lc 'bash ./get.sh --dry-run --yes' | tee "get-sh-${{ matrix.distro }}.out"
          grep -F '${{ matrix.expected }}' "get-sh-${{ matrix.distro }}.out"

  get-sh-integration:
    name: get.sh source install/uninstall
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify a fake release end to end in Ubuntu
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD":/src -w /src ubuntu:24.04 bash -lc '
            set -euo pipefail
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              ca-certificates curl git nftables iptables ipset python3 sudo tar util-linux
            useradd -m tester
            printf "tester ALL=(ALL) NOPASSWD:ALL\n" >/etc/sudoers.d/tester
            chmod 440 /etc/sudoers.d/tester
            cp -a /src /tmp/repo
            chown -R tester:tester /tmp/repo
            git config --global --add safe.directory /tmp/repo
            cd /tmp/repo
            mkdir -p /tmp/release
            git archive --format=tar.gz --prefix=cs2blocker-0.2.0/ \
              -o /tmp/release/cs2blocker-0.2.0.tar.gz HEAD
            (cd /tmp/release && sha256sum cs2blocker-0.2.0.tar.gz > SHA256SUMS)
            python3 -m http.server 8000 --directory /tmp/release >/tmp/http.log 2>&1 &
            server_pid=$!
            trap "kill $server_pid 2>/dev/null || true" EXIT
            sleep 1
            runuser -u tester -- env HOME=/home/tester XDG_STATE_HOME=/home/tester/.local/state \
              GET_SH_BASE_URL=http://127.0.0.1:8000 \
              bash -lc "cd /tmp/repo && ./get.sh --method source --version v0.2.0 --yes"
            test -x /usr/bin/cs2blocker-gui
            runuser -u tester -- env HOME=/home/tester XDG_STATE_HOME=/home/tester/.local/state \
              GET_SH_BASE_URL=http://127.0.0.1:8000 \
              bash -lc "cd /tmp/repo && ./get.sh --uninstall --yes"
            test ! -e /usr/bin/cs2blocker-gui

            mkdir -p /tmp/release-bad
            cp /tmp/release/cs2blocker-0.2.0.tar.gz /tmp/release-bad/
            cp /tmp/release/SHA256SUMS /tmp/release-bad/
            printf "corrupt\n" >> /tmp/release-bad/cs2blocker-0.2.0.tar.gz
            python3 -m http.server 8001 --directory /tmp/release-bad >/tmp/http-bad.log 2>&1 &
            bad_pid=$!
            trap "kill $server_pid $bad_pid 2>/dev/null || true" EXIT
            sleep 1
            if runuser -u tester -- env HOME=/home/tester XDG_STATE_HOME=/home/tester/.local/state \
              GET_SH_BASE_URL=http://127.0.0.1:8001 \
              bash -lc "cd /tmp/repo && ./get.sh --method source --version v0.2.0 --yes" \
              >/tmp/get-sh-bad.out 2>/tmp/get-sh-bad.err; then
              echo "corrupted download unexpectedly succeeded" >&2
              exit 1
            fi
            grep -qi "checksum mismatch" /tmp/get-sh-bad.err
            test ! -e /usr/bin/cs2blocker-gui
          '
