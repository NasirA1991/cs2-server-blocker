name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables ipset iptables
      - name: Compile
        run: python3 -m compileall -q cs2blocker tests
      - name: Unit and integration tests
        run: python3 -m unittest discover -s tests -v

  packages:
    name: Debian, RPM and tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install nfpm
        run: |
          curl -sSL -o /tmp/nfpm.tar.gz \
            https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz
          sudo tar -xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm
          nfpm --version
      - name: Stage files
        run: ./packaging/install.sh --root packaging/staging --no-daemon-reload
      - name: Build packages
        run: |
          mkdir -p packaging/dist
          nfpm package --config packaging/nfpm.yaml --packager deb \
            --target packaging/dist/cs2blocker_0.1.1-1_amd64.deb
          nfpm package --config packaging/nfpm.yaml --packager rpm \
            --target packaging/dist/cs2blocker-0.1.1-1.x86_64.rpm
          git archive --format=tar.gz --prefix=cs2blocker-0.1.1/ \
            -o packaging/dist/cs2blocker-0.1.1.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: packaging/dist/*

  arch:
    name: Arch package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build in Arch Linux
        run: |
          docker run --rm -v "$PWD":/src -w /src archlinux:latest bash -lc '
            pacman -Syu --noconfirm --needed base-devel git python nftables polkit python-gobject python-cairo gtk4 libadwaita
            useradd -m builder
            chown -R builder:builder /src
            su builder -c "cd /src/packaging && makepkg -f --nodeps"
          '
      - uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: packaging/cs2blocker-*.pkg.tar.zst
